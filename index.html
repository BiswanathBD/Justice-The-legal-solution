<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- tailwind play cdn link -->
    <script src="https://kit.fontawesome.com/f4485066ab.js" crossorigin="anonymous"></script>
    <!-- font awesome my kid -->
     <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

        .poppins {
        font-family: Poppins;
        font-weight: 400;
        }
        .garamond {
        font-family: EB Garamond;
        font-optical-sizing: auto;
        }
    </style>

    <title>Justice | The legal solution</title>
</head>
<body class="max-w-[1150px] mt-10 mx-auto poppins">
    <header>
        <nav class="flex justify-between items-center">
            <img src="./images/logo2.png" alt="">
            <ul class="flex gap-[30px] text-[#707070]">
                <li>Home</li>
                <li>Services <i class="fa-solid fa-chevron-right"></i></li>
                <li class="ml-1">Cases <i class="fa-solid fa-chevron-right"></i></li>
                <li class="ml-1">Blog <i class="fa-solid fa-chevron-right"></i></li>
                <li class="ml-1">Contact Us <i class="fa-solid fa-chevron-right"></i></li>
            </ul>
            <button class="text-white bg-[#B68C5A] px-7 py-5 rounded-[8px] font-bold poppins">Free Consultation</button>
        </nav>
        <div class="relative h-[540px] mt-10 flex justify-center items-center">
            <img class="absolute" src="./images/banner.png" alt="">
            <img class="absolute" src="./images/Rectangle 5.png" alt="">
            <div class="absolute text-white max-w-[692px] text-center">
                <h1 class="text-[72px]/[86px] garamond font-extrabold">We Provide Effective Legal Solutions</h1>
                <p class="text-[#E7E7E7] mt-6 mb-8">There are many variations of passages of Lorem Ipsum available, but the majority have suffered alteration in some form, by injected humour.</p>
                <div class="flex justify-center w-full gap-6">
                    <input class="w-full bg-white text-[#A0A0A0] pl-5 rounded-[8px]" type="text" name="Search" id="search" placeholder="Search your services">
                    <button class="text-[20px] font-semibold px-10 py-4 bg-[#B68C5A] rounded-[8px]">Search</button>
                </div>
            </div>
        </div>
    </header>
</body>
</html>
